server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets with long cache TTL
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------
    # NOTE: the Dockerfile now uses server/index.mjs, which also proxies NSE
    # India (cookie session required, not possible in plain nginx). This file
    # remains for static hosting with US (SEC) data only.
    # SEC EDGAR proxy. The SEC requires a User-Agent with a contact
    # email and sends no CORS headers, so the app calls /api/sec/*.
    # Replace the contact below with your own before deploying.
    # ---------------------------------------------------------------
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $sec_ua "AURA M&A Platform admin@example.com";

    location /api/sec/data/ {
        proxy_pass https://data.sec.gov/;
        proxy_set_header Host data.sec.gov;
        proxy_set_header User-Agent $sec_ua;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=600";
    }
    location /api/sec/efts/ {
        proxy_pass https://efts.sec.gov/;
        proxy_set_header Host efts.sec.gov;
        proxy_set_header User-Agent $sec_ua;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=300";
    }
    location /api/sec/www/files/ {
        proxy_pass https://www.sec.gov/files/;
        proxy_set_header Host www.sec.gov;
        proxy_set_header User-Agent $sec_ua;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA routing: any route not matching a physical file is rewritten to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom 404 handler fallback to index.html for React router
    error_page 404 /index.html;
}
